name: Django Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: django
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_DB: django_test_db
      POSTGRES_USER: django
      POSTGRES_PASSWORD: password
      DATABASE_URL: postgres://django:password@localhost:5432/django_test_db

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Linting
      run: flake8 .

    - name: Run migrations
      run: python manage.py migrate

    - name: Run tests
      run: python manage.py test --parallel